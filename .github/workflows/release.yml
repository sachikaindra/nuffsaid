# Builds NuffSaid-Setup.exe on GitHub's Windows machines.
# - Every push to main and every manual run: builds and keeps the installer as a downloadable artifact.
# - Pushing a tag like v1.0.2: builds and attaches the installer to that GitHub Release.
# The agency fonts are stored encrypted (assets/fonts.zip.gpg); the FONTS_KEY secret unlocks them here only.
name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (no NVIDIA packages; the app downloads those on first run)
        shell: pwsh
        run: |
          Get-Content requirements.txt | Where-Object { $_ -notmatch '^nvidia' } | Set-Content requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Unlock the fonts
        shell: pwsh
        env:
          FONTS_KEY: ${{ secrets.FONTS_KEY }}
        run: |
          if (-not $env:FONTS_KEY) { Write-Warning 'No FONTS_KEY: building with system fonts'; exit 0 }
          gpg --batch --yes --quiet --pinentry-mode loopback --passphrase "$env:FONTS_KEY" --output fonts.zip --decrypt assets/fonts.zip.gpg
          Expand-Archive fonts.zip -DestinationPath assets/fonts -Force
          Remove-Item fonts.zip

      - name: Build the app
        shell: pwsh
        run: ./build-release.ps1 -Python python

      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          Copy-Item LICENSE LICENSE.txt
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\NuffSaid.iss
          (Get-FileHash release-installer\NuffSaid-Setup.exe -Algorithm SHA256).Hash.ToLower() | Tee-Object release-installer\sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NuffSaid-Setup
          path: |
            release-installer/NuffSaid-Setup.exe
            release-installer/sha256.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "NuffSaid $($tag.TrimStart('v'))" --notes "Built automatically from $tag." }
          gh release upload $tag release-installer/NuffSaid-Setup.exe --clobber
